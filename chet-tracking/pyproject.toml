[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chet-tracking"
version = "0.1.0"
description = "CPU/GPU positron tracking for the muEDM CHeT scintillating-fibre tracker"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
root = ["uproot>=5"]
test = ["pytest"]

[project.scripts]
chet-track = "chet_tracking.cli:main"

[tool.setuptools]
packages = ["chet_tracking"]
